[package]
name = "ningmao-transfer-receiver"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
ningmao-transfer-contract = { path = "../transfer-contract" }
httparse = "=1.10.1"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
uuid = { version = "=1.24.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
cap-std = "=4.0.3"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Wdk_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile = "=3.27.0"
