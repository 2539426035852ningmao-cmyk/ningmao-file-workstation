[package]
name = "ningmao-loopback-probe"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = ["probe-cli"]
probe-cli = [
    "dep:cap-std",
    "dep:rcgen",
    "dep:rustix",
    "dep:serde",
    "dep:sha2",
    "dep:tempfile",
    "dep:uuid",
    "dep:windows-sys",
    "ningmao-transfer-client/probe-hooks",
]

[[bin]]
name = "ningmao-loopback-probe"
path = "src/main.rs"
required-features = ["probe-cli"]

[dependencies]
ningmao-transfer-contract = { path = "../../crates/transfer-contract" }
ningmao-transfer-client = { path = "../../crates/transfer-client" }
httparse = "=1.10.1"
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "ring"], optional = true }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", optional = true }
tempfile = { version = "=3.27.0", optional = true }
uuid = { version = "=1.24.0", features = ["v4"], optional = true }

[target.'cfg(windows)'.dependencies]
cap-std = { version = "=4.0.3", optional = true }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Wdk_Storage_FileSystem", "Win32_System_IO"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"], optional = true }

[profile.dev]
debug = 0

[dev-dependencies]
# Compile the exact desktop Store/adapter without pulling Tauri into the isolated probe.
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
