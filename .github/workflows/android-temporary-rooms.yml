name: Android temporary rooms
on:
  pull_request:
    paths:
      - "apps/web/tests/android-room.mjs"
      - "apps/web/tests/room-test-tls.mjs"
      - "apps/web/tests/room-test-qr.mjs"
      - "apps/web/src/TemporaryRoom.tsx"
      - "apps/web/selfhost/**"
      - ".github/workflows/android-temporary-rooms.yml"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the temporary room site
        working-directory: apps/web
        run: npm install --no-audit --no-fund && npm run build && npx playwright install --with-deps chromium
      - name: Allow KVM on the isolated runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-ningmao-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Chrome and station exchange synthetic files
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader -no-snapshot -no-audio -no-boot-anim -no-metrics
          script: node apps/web/tests/android-room.mjs && node apps/web/tests/android-room.mjs --https-emulator
