name: M1-02 Windows baselines

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/m1-02/**'
      - 'scripts/m1-02/**'
      - '.github/workflows/m1-02-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-02-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows baseline ${{ matrix.baseline }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        baseline: [A, B]
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust and record environment
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
          node --version
          npm --version
      - name: Build locked Windows baseline
        shell: pwsh
        run: ./scripts/m1-02/build-baselines.ps1 -Baseline ${{ matrix.baseline }}
