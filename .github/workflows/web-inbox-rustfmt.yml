name: Temporary W3 Rust format normalization

on:
  push:
    branches: [feat/web-desktop-inbox-20261109]
    paths: [.github/workflows/web-inbox-rustfmt.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-desktop-inbox-20261109
      - name: Format Rust with repository toolchain
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit only formatted W3 receiver
        run: |
          git add apps/desktop/src-tauri/src/web_transfer_receive.rs
          if git diff --cached --quiet; then
            echo "Rust receiver already formatted"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(desktop): rustfmt safe Web receive adapter [skip ci]"
            git push origin HEAD:refs/heads/feat/web-desktop-inbox-20261109
          fi
