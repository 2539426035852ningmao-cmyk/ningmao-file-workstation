name: M1-03 UI comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/m1-03/**'
      - 'scripts/m1-03/**'
      - '.github/workflows/m1-03-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: M1-03 browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: experiments/m1-03/ui-comparison/package-lock.json
      - name: Build and browser regression checks
        shell: pwsh
        run: ./scripts/m1-03/build-ui.ps1 -Browser
  windows:
    name: M1-03 Windows build
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: experiments/m1-03/ui-comparison/package-lock.json
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check and build native probe
        shell: pwsh
        run: ./scripts/m1-03/build-ui.ps1 -Native
