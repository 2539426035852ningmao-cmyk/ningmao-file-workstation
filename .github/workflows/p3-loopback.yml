name: P3 isolated loopback
on:
  pull_request:
    paths: ['experiments/p3-loopback/**', 'crates/transfer-contract/**', 'crates/transfer-client/**', 'apps/desktop/src-tauri/src/transfer*.rs', 'apps/desktop/src-tauri/src/browser_share*.rs', 'apps/desktop/src-tauri/src/store.rs', 'apps/desktop/src-tauri/src/store/**', '.github/workflows/p3-loopback.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Rust
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Check and run two controlled processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path experiments/p3-loopback/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path crates/transfer-contract/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path experiments/p3-loopback/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path experiments/p3-loopback/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo run --locked --manifest-path experiments/p3-loopback/Cargo.toml -- probe (Join-Path $env:RUNNER_TEMP 'ningmao-p3-probe')
          exit $LASTEXITCODE
      - name: Record synthetic two-process evidence
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'ningmao-p3-probe/sender-result.json'
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.status -ne 'SUCCESS' -or $report.scope -ne 'TWO_PROCESS_LOOPBACK_MTLS') { throw 'Unexpected probe result' }
          "Source: $env:GITHUB_SHA; OS: $env:RUNNER_OS; topology: two processes on ONE runner, not independent machines or LAN." >> $env:GITHUB_STEP_SUMMARY
          "Synthetic source SHA256: $($report.sha256); source preserved: $($report.sourcePreserved); collision protected: $($report.collisionProtected)." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload only sanitized transfer result
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: p3-loopback-evidence-${{ runner.os }}
          path: ${{ runner.temp }}/ningmao-p3-probe/sender-result.json
          if-no-files-found: error
          retention-days: 7
