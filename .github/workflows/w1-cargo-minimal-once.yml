name: Temporary minimal W1 Cargo lock
on:
  push:
    branches: [feat/web-w1-native-wss-20261109]
    paths: [.github/workflows/w1-cargo-minimal-once.yml]
permissions:
  contents: write
jobs:
  minimal-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-w1-native-wss-20261109
      - uses: dtolnay/rust-toolchain@stable
      - name: Preserve original dependency pins while resolving only WSS additions
        run: |
          git show 563f094a6935047a190fb09edd999ffb4e6d8c82:apps/desktop/src-tauri/Cargo.lock > apps/desktop/src-tauri/Cargo.lock
          cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 > /dev/null
          git diff --stat -- apps/desktop/src-tauri/Cargo.lock
      - name: Commit deterministic minimal dependency set
        run: |
          git add apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then echo "Already minimal"; else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(w1): minimize new WSS dependencies without unrelated crate upgrades"
            git push origin HEAD:refs/heads/feat/web-w1-native-wss-20261109
          fi
