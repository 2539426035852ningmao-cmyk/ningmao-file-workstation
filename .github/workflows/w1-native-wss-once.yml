name: Temporary W1 native websocket dependency lock and Rust format
on:
  push:
    branches: [feat/web-w1-native-wss-20261109]
    paths: [.github/workflows/w1-native-wss-once.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-w1-native-wss-20261109
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Update lockfile and format exact W1 Rust source
        run: |
          cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml --offline || cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit only lock and W1 native source
        run: |
          git add apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src/web_device.rs
          if git diff --cached --quiet; then
            echo "Already normalized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(w1): lock secure WebSocket dependency and normalize Rust source"
            git push origin HEAD:refs/heads/feat/web-w1-native-wss-20261109
          fi
