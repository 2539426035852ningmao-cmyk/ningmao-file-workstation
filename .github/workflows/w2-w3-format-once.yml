name: Temporary W2-W3 native rustfmt
on:
  push:
    branches: [feat/web-w2-w3-native-rtc-bridge-20261109]
    paths: [.github/workflows/w2-w3-format-once.yml]
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-w2-w3-native-rtc-bridge-20261109
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit only formatted native W2-W3 bridge
        run: |
          git add apps/desktop/src-tauri/src/web_device.rs apps/desktop/src-tauri/src/lib.rs
          if git diff --cached --quiet; then echo "Already formatted"; else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(w2-w3): normalize native WSS relay with strict rustfmt"
            git push origin HEAD:refs/heads/feat/web-w2-w3-native-rtc-bridge-20261109
          fi
