name: Web Transfer CI
on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-transfer.yml"
  push:
    branches:
      - "feat/web-transfer-mvp-20261109"
    paths:
      - "apps/web/**"
      - ".github/workflows/web-transfer.yml"
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Validate source deployment boundary
        run: npm run preflight:source
      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run --outdir /tmp/ningmao-web-worker
