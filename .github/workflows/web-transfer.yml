name: Web Transfer W0

on:
  push:
    branches:
      - feat/web-transfer-foundation-20261109
    paths:
      - "apps/web/**"
      - ".github/workflows/web-transfer.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Check generated files
        run: test -s dist/index.html
